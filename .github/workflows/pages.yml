name: Deploy Funda360 Marketing Site to GitHub Pages

on:
  push:
    branches: [ccr-d8e3ba6b-jy0prt]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-marketing"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static site
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_SITE_URL: https://funda360.aurisnexus.co.za
          NEXT_PUBLIC_APP_LOGIN_URL: https://app.funda360.aurisnexus.co.za/login
          NEXT_PUBLIC_ALLOW_INDEXING: "true"
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
