name: Deploy Funda360 Demo Request Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "funda360-demo-request-worker"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/demo-request
          command: deploy

      - name: Deployment configuration reminder
        run: |
          echo "Worker code deployed."
          echo "Delivery secrets must exist on the Worker before the endpoint can accept real demo requests."
          echo "Required: RESEND_API_KEY + DEMO_REQUEST_EMAIL_TO + DEMO_REQUEST_EMAIL_FROM, or DEMO_REQUEST_WEBHOOK_URL."
